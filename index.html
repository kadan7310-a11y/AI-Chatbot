<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieFlix Bot - My Chatbot Project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <p class="notice">This is my college portfolio project - Not a real AI company</p>
    
    <div class="chat-app">
        <div class="header">
            <h2>MovieFlix Bot</h2>
            <span>my first chatbot</span>
        </div>

        <div id="chatBox" class="chat-box">
            <div class="msg bot">
                <p>Hi! I'm your movie helper bot. Ask me about any movie!</p>
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Type your message...">
            <button id="sendBtn">Send</button>


    <script src="script.js"></script>
</body>
</html>
